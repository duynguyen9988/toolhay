<header class="site-header">
  <a class="brand" href="{{ .Site.Home.RelPermalink }}" aria-label="Về trang Sổ Chi Tiêu">
    <span class="brand-mark" aria-hidden="true">₫</span>
    <span><strong>Sổ Chi Tiêu</strong><small>Mỗi ngày, rõ ràng hơn</small></span>
  </a>
  <nav class="main-nav" aria-label="Điều hướng chính">
    <a class="nav-link{{ if .IsHome }} is-active{{ end }}" href="{{ .Site.Home.RelPermalink }}">Trang chủ</a>
    <a class="nav-link{{ if eq .Section "blog" }} is-active{{ end }}" href="{{ "blog/" | relURL }}">Blog</a>
    <a class="nav-link{{ if eq .Section "link-hay" }} is-active{{ end }}" href="{{ "link-hay/" | relURL }}">Link Hay</a>
    <a class="nav-link{{ if eq .Section "flights" }} is-active{{ end }}" href="{{ "flights/" | relURL }}">Chuyến bay</a>
    <a class="nav-link{{ if eq .Section "tools" }} is-active{{ end }}" href="{{ "tools/" | relURL }}">Công cụ</a>
  </nav>
</header>
